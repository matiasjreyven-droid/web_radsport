<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="USWE No Dancing Monkey">
  <defs>
    <filter id="ndmRough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.018" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g transform="rotate(-6.4 320 200)" filter="url(#ndmRough)">
    <rect x="68" y="58" width="504" height="284" fill="none" stroke="#E2231A" stroke-width="15"/>
    <g fill="#E2231A" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="76" letter-spacing="-1.5">
      <text x="100" y="144">NO</text>
      <text x="100" y="228">DANCING</text>
      <text x="100" y="312">MONKEY<tspan font-size="30" dy="-40">™</tspan></text>
